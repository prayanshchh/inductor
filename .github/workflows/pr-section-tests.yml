name: PR Section Tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.filter.outputs.tools }}
      providers: ${{ steps.filter.outputs.providers }}
      opentui: ${{ steps.filter.outputs.opentui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tools:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/harness-core/**'
              - 'crates/tools/**'
              - '.github/workflows/**'
              - 'scripts/checks/**'
            providers:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/harness-core/**'
              - 'crates/provider-core/**'
              - 'crates/provider-claude/**'
              - 'crates/provider-codex/**'
              - 'crates/provider-copilot/**'
              - 'crates/tools/**'
              - '.github/workflows/**'
              - 'scripts/checks/**'
            opentui:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'bun.lock'
              - 'package.json'
              - 'packages/tui/**'
              - 'crates/agent/src/tui.rs'
              - 'crates/provider-claude/js/package.json'
              - 'crates/provider-claude/js/package-lock.json'
              - '.github/workflows/**'
              - 'scripts/checks/**'

  test-tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test tools
        run: cargo test -p tools

  test-providers:
    needs: changes
    if: needs.changes.outputs.providers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test providers
        run: cargo test -p provider-core -p provider-claude -p provider-codex -p provider-copilot

  test-opentui:
    needs: changes
    if: needs.changes.outputs.opentui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Test OpenTUI frontend
        run: bash scripts/checks/tui-quality.sh
