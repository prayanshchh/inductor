name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            python3 -c 'import sys, tomllib; data = tomllib.loads(sys.stdin.read()); print(data["package"]["version"])'
          }

          current_version="$(read_version < crates/agent/Cargo.toml)"
          [ -n "$current_version" ] || {
            echo "could not read current version from crates/agent/Cargo.toml" >&2
            exit 1
          }

          tag="${{ github.ref_name }}"
          if [ "$tag" != "$current_version" ]; then
            echo "release tag ${tag} does not match crates/agent/Cargo.toml version ${current_version}" >&2
            exit 1
          fi

          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target-label: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Build release bundle
        run: |
          INDUCTOR_RELEASE_TARGET_LABEL=${{ matrix.target-label }} \
          bash scripts/release/build-bundle.sh
      - name: Verify release artifacts
        run: |
          test -f dist/release/inductor-${{ matrix.target-label }}.tar.gz
          test -f dist/release/inductor-${{ matrix.target-label }}.tar.gz.sha256
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target-label }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256

  publish:
    needs:
      - detect
      - bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Inductor ${{ needs.detect.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
