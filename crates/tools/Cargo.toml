[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
harness-core = { version = "0.1.0", path = "../harness-core" }
sandbox = { version = "0.1.0", path = "../sandbox" }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
libc = "0.2.177"
tokio = { version = "1.48.0", features = ["io-util", "process", "rt", "macros", "time"] }
tokio-util = "0.7.17"
