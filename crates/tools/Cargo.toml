[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
sandbox = { version = "0.1.0", path = "../sandbox" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["process", "rt", "macros"] }
tokio-util = "0.7.17"
