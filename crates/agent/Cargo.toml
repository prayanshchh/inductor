[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "inductor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
auth = { version = "0.1.0", path = "../auth" }
base64 = "0.21"
image = "0.24"
clap = {version = "4.6.1", features = ["derive"]}
context = { version = "0.1.0", path = "../context" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
diff = { version = "0.1.0", path = "../diff" }
futures-util = "0.3.32"
git = { version = "0.1.0", path = "../git" }
harness-core = { version = "0.1.0", path = "../harness-core" }
harness-runtime = { version = "0.1.0", path = "../harness-runtime" }
persistence = { version = "0.1.0", path = "../persistence" }
provider-claude = { version = "0.1.0", path = "../provider-claude" }
session-naming = { version = "0.1.0", path = "../session-naming" }
provider-codex = { version = "0.1.0", path = "../provider-codex" }
provider-core = { version = "0.1.0", path = "../provider-core" }
ratatui = "=0.30.0"
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
syntect = "5.3.0"
terminal = { version = "0.1.0", path = "../terminal" }
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.18"
tools = { version = "0.1.0", path = "../tools" }
