[package]
name = "provider-claude"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
futures-core = "0.3.32"
harness-core = { version = "0.1.0", path = "../harness-core" }
provider-core = { version = "0.1.0", path = "../provider-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["process", "io-util", "rt", "time", "sync", "macros"] }
tokio-util = "0.7.18"
tools = { version = "0.1.0", path = "../tools" }
